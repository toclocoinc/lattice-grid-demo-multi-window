name: Publish the demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A run already under way is left to finish, so a
# half-uploaded site is never what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the demo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The page loads the grid from the CDN. The check drives two windows in
      # headless Chrome against that same published build, then the browser
      # driver is removed so only the page is published.
      - name: Check the page works in a browser
        run: |
          npm i --no-save --no-package-lock playwright-core@1.65
          node tools/verify.mjs --base https://cdn.latticegrid.dev/lattice-grid@1.120.0 --chrome "$(command -v google-chrome)"
          rm -rf node_modules

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v4
